# macOS PF (Packet Filter) Anchor — Backend Service Isolation on Primary Mac (10.109.112.94)
#
# Purpose:
#   Restrict direct LAN access to Express backend ports 4000 and 6000 while
#   allowing:
#     1. Localhost (lo0) access for Primary Nginx on 10.109.112.94.
#     2. Inbound TCP access from the Secondary Mac (10.109.112.62) for Standby Nginx.
#   All other inbound TCP connections to ports 4000 and 6000 are blocked.
#
# Important Design Note:
#   PF evaluates Layer 3/4 packet headers (source IP and destination port).
#   Therefore, the allow rule permits any process originating from 10.109.112.62
#   to connect to ports 4000/6000, not exclusively the Nginx process.
#
# Deployment target on Primary Mac:
#   /etc/pf.anchors/cn_project

# 1. Allow local loopback traffic (Primary Nginx -> Backend A/B on Primary Mac)
pass in quick on lo0 proto tcp from any to any port { 4000, 6000 } keep state

# 2. Allow Secondary Mac (Standby Nginx host) to reach Backend A/B over the LAN
pass in quick proto tcp from 10.109.112.62 to any port { 4000, 6000 } keep state

# 3. Block all other inbound TCP connections to backend ports 4000 and 6000
block in quick proto tcp from any to any port { 4000, 6000 }
