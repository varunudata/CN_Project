# Backup dnsmasq Configuration — Secondary Mac / Varun's Mac (10.109.112.62)
#
# Purpose:
#   Secondary private DNS resolver providing DNS high availability (Extension A).
#   Clients list 10.109.112.94 (primary) first and 10.109.112.62 (backup) second.
#   When primary dnsmasq on 10.109.112.94 is stopped, clients seamlessly resolve
#   app.team1.test and api.team1.test via this backup server.
#
# Active deployment path on Secondary Mac:
#   /opt/homebrew/etc/dnsmasq.conf

listen-address=127.0.0.1,10.109.112.62
bind-interfaces
port=53

no-resolv
server=8.8.8.8
server=1.1.1.1

host-record=app.team1.test,10.109.112.62
host-record=api.team1.test,10.109.112.62

local-ttl=30

log-queries
log-facility=/tmp/dnsmasq-backup.log
