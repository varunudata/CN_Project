# Primary dnsmasq Configuration — Primary Mac (10.109.112.94)
#
# Purpose:
#   Authoritative private DNS server for *.team1.test on the LAN.
#   - Listens on localhost and the Primary Mac's Wi-Fi IP (10.109.112.94).
#   - Uses a 30-second TTL (local-ttl=30) to support rapid DNS cutover testing.
#   - Forwards all non-local DNS queries to public resolvers (8.8.8.8, 1.1.1.1).
#
# Deployment target on Primary Mac:
#   /opt/homebrew/etc/dnsmasq.conf (Homebrew on Apple Silicon)
#
# Note on IP addresses:
#   - Initial Phase 1 / Phase 2 pre-cutover state resolves app.team1.test and
#     api.team1.test to the Primary Edge Nginx (10.109.112.94).
#   - Post-cutover Phase 2 state (current active state) resolves both names to
#     the Standby Edge Nginx on the Secondary Mac (10.109.112.62).
#   - Replace <PRIMARY_MAC_IP> / <EDGE_IP> if DHCP leases change.

listen-address=127.0.0.1,10.109.112.94
bind-interfaces
port=53

no-resolv
server=8.8.8.8
server=1.1.1.1

# --- Active Phase 2 Cutover Records (pointing to Standby Nginx on Secondary Mac) ---
host-record=app.team1.test,10.109.112.62
host-record=api.team1.test,10.109.112.62

# --- Pre-Cutover Primary Edge Records (uncomment to route to Primary Nginx) ---
# host-record=app.team1.test,10.109.112.94
# host-record=api.team1.test,10.109.112.94

local-ttl=30

log-queries
log-facility=/tmp/dnsmasq.log
