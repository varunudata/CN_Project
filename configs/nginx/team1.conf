events {
    worker_connections 1024;
}

http {
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr ssl=$ssl_protocol';
    access_log /tmp/cn_project_nginx_access.log lb;
    error_log  /tmp/cn_project_nginx_error.log warn;

    # Load balancer pool (round-robin), passive health checks
    upstream backends {
        server 127.0.0.1:4000 max_fails=2 fail_timeout=10s;   # Backend A
        server 127.0.0.1:6000 max_fails=2 fail_timeout=10s;   # Backend B
        keepalive 16;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name app.team1.test api.team1.test;
        return 301 https://$host$request_uri;
    }

    # HTTPS edge (TLS termination)
    server {
        listen 443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /Users/musthyalasadhvik/Desktop/CN_Project/certs/app.pem;
        ssl_certificate_key /Users/musthyalasadhvik/Desktop/CN_Project/certs/app-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover: retry on the other backend if one fails
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
        }
    }
}
