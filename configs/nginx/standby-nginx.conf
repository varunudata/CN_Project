# Standby Nginx Reverse Proxy & Load Balancer — Secondary Mac / Varun's Mac (10.109.112.62)
#
# Purpose:
#   Standby edge proxy supporting controlled edge migration (Extension E).
#   - Terminates HTTPS (TLS + HTTP/2) on 10.109.112.62:443 using the same
#     CA-signed certificate pair (app.pem / app-key.pem).
#   - Proxies traffic over the LAN to Backend A (10.109.112.94:4000) and
#     Backend B (10.109.112.94:6000) on the Primary Mac.
#   - Requires both backends on 10.109.112.94 to bind to 0.0.0.0 and PF firewall
#     rules on 10.109.112.94 to allow inbound TCP 4000/6000 from 10.109.112.62.
#
# Active deployment path on Secondary Mac:
#   ~/cn-standby/nginx.conf
#
# Note:
#   Replace <STANDBY_CERTS_DIR> with the directory containing app.pem and app-key.pem
#   (e.g., /Users/<username>/cn-standby). Never commit app-key.pem to Git.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backends {
        server 10.109.112.94:4000;
        server 10.109.112.94:6000;
        # Optional hardening (mirrors Primary Nginx):
        # server 10.109.112.94:4000 max_fails=2 fail_timeout=10s;
        # server 10.109.112.94:6000 max_fails=2 fail_timeout=10s;
    }

    # Port 80 listener (currently proxies directly; can optionally use
    # `return 301 https://$host$request_uri;` to match Primary Nginx redirect behavior)
    server {
        listen 80;
        server_name app.team1.test api.team1.test;

        location / {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Port 443 HTTPS edge (TLS termination + HTTP/2)
    server {
        listen 443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate     <STANDBY_CERTS_DIR>/app.pem;
        ssl_certificate_key <STANDBY_CERTS_DIR>/app-key.pem;

        location / {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
